
# Environnement Docker FACULTATIF : une base MariaDB (même moteur que les migrations)
# et Mailpit pour lire les e-mails envoyés en développement.
# Sans Docker, un serveur MySQL/MariaDB local (Laragon, Wamp, XAMPP) suffit.
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:${MARIADB_VERSION:-10.11}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-sortir}
      # À changer : mot de passe de développement uniquement
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
